name: Deploy v2 to GitHub Pages

on:
  push:
    branches: [claude/wildfire-rewrite]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-pages.yml'
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Supabase URL + anon key are public (the anon key is meant for the
      # browser and is protected by RLS), so they live in repo *variables*, not
      # secrets. The site reads real data only when both are set; otherwise it
      # builds in demo mode. VITE_MAP_STYLE is optional (keyless basemap URL).
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MAP_STYLE: ${{ vars.VITE_MAP_STYLE }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
